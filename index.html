<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotizador SC Cortinados</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #formularioCotizador {
      background: #ffffff;
      padding: 25px 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      max-width: 500px;
      width: 100%;
    }
    .logo-container {
      text-align: center;
      margin-bottom: 15px;
    }
    .logo-img {
      max-width: 180px;
      height: auto;
      display: block;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #1b5e20;
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      color: #333;
      margin-top: 15px;
      margin-bottom: 5px;
      font-size: 14px;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #2e7d32;
    }
    .flex-row {
      display: flex;
      gap: 10px;
    }
    .flex-row > div {
      flex: 1;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 18px;
      transition: background 0.2s;
    }
    .btn-calcular {
      background-color: #1b5e20;
      color: white;
    }
    .btn-calcular:hover {
      background-color: #144417;
    }
    .btn-agregar {
      background-color: #1565c0;
      color: white;
    }
    .btn-agregar:hover {
      background-color: #0d47a1;
    }
    .btn-enviar {
      background-color: #2e7d32;
      color: white;
    }
    .btn-enviar:hover {
      background-color: #1b5e20;
    }
    #errorBox {
      color: #d32f2f;
      background: #ffebee;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: none;
      font-size: 13px;
    }
    #resultadoPrecio {
      margin-top: 15px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      color: #1b5e20;
    }
    .pedido-item {
      background: #f9f9f9;
      border-left: 4px solid #2e7d32;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 6px;
      font-size: 13px;
    }
    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 15px;
    }
    .checkbox-container input {
      width: auto;
    }
    #mensajeExito {
      display: none;
      background: #e8f5e9;
      border: 1px solid #a5d6a7;
      color: #1b5e20;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="formularioCotizador">
    
    <!-- Contenedor del Logo -->
    <div class="logo-container">
      <img src="logo.png" alt="SC Cortinados" class="logo-img" onerror="if(!this.dataset.triedJpg){this.dataset.triedJpg=true;this.src='logo.jpg';}else{this.style.display='none';}">
    </div>

    <h1>✂️ Cotizador SC Cortinados</h1>
    <div id="errorBox"></div>

    <div id="contenidoFormulario">
      <label for="clienteObra">👤 Cliente / Obra:</label>
      <input type="text" id="clienteObra" placeholder="Nombre o referencia">

      <label for="emailVendedor">📧 Email Vendedor:</label>
      <input type="email" id="emailVendedor" placeholder="tu-email@ejemplo.com" onchange="localStorage.setItem('emailVendedorRegistrado', this.value)">

      <label for="mecanismo">⚙️ Mecanismo:</label>
      <select id="mecanismo">
        <option value="32 PLUS">32 PLUS</option>
        <option value="32 PREMIUM">32 PREMIUM</option>
        <option value="38 PLUS">38 PLUS</option>
        <option value="38 PREMIUM">38 PREMIUM</option>
      </select>

      <div class="flex-row">
        <div>
          <label for="ancho">↔️ Ancho (m):</label>
          <input type="number" id="ancho" step="0.01" placeholder="Ej: 1.50">
        </div>
        <div>
          <label for="alto">↕️ Alto (m):</label>
          <input type="number" id="alto" step="0.01" placeholder="Ej: 2.10">
        </div>
      </div>

      <label for="tipoTela">📜 Tipo de Tela:</label>
      <input type="text" id="tipoTela" placeholder="Ej: Blackout, Screen">

      <label for="colorTela">🎨 Color:</label>
      <input type="text" id="colorTela" placeholder="Ej: Blanco, Beige">

      <label for="caida">🔄 Caída:</label>
      <select id="caida">
        <option value="Por Atrás">Por Atrás</option>
        <option value="Por Delante">Por Delante</option>
      </select>

      <label for="cadena">🔗 Cadena:</label>
      <select id="cadena">
        <option value="Plástica">Plástica</option>
        <option value="Metálica">Metálica</option>
      </select>

      <div class="checkbox-container">
        <input type="checkbox" id="dobleSistema">
        <label for="dobleSistema" style="margin:0;">✨ ¿Doble Sistema?</label>
      </div>

      <label for="observaciones">📝 Observaciones / Detalles:</label>
      <textarea id="observaciones" rows="2" placeholder="Detalles adicionales..."></textarea>

      <button class="btn-calcular" onclick="calcularPrecioWeb()">💰 Calcular Precio</button>
      <div id="resultadoPrecio"></div>

      <button class="btn-agregar" onclick="agregarAlPedido()" style="display:none;" id="btnAgregar">➕ Agregar al Pedido</button>

      <div id="listaPedidoContainer" style="margin-top:20px; display:none;">
        <h3 style="color:#1b5e20; margin-bottom:10px;">🛒 Resumen del Pedido:</h3>
        <div id="listaPedidoItems"></div>
        <button class="btn-enviar" onclick="enviarPedidoWeb()">🚀 Confirmar y Enviar Pedido</button>
      </div>
    </div>

    <!-- Contenedor Mensaje Éxito -->
    <div id="mensajeExito">
      <h2 style="margin-top:0;">✅ ¡Pedido Enviado!</h2>
      <p>El pedido fue registrado correctamente en el sistema y se envió una copia de respaldo a tu correo electrónico.</p>
      <button class="btn-calcular" onclick="nuevoPedido()">➕ Cargar Otro Pedido</button>
    </div>

  </div>

  <script>
    // URL de tu Apps Script
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby..." ; // Colocá aquí tu URL ejecutable de Apps Script si es necesario

    let productosEnPedido = [];
    let ultimoPrecioCalculado = "";

    window.onload = function() {
      const emailGuardado = localStorage.getItem('emailVendedorRegistrado');
      if (emailGuardado) {
        document.getElementById('emailVendedor').value = emailGuardado;
      }
    };

    function mostrarError(msg) {
      const box = document.getElementById('errorBox');
      if (msg) {
        box.innerText = msg;
        box.style.display = 'block';
      } else {
        box.style.display = 'none';
      }
    }

    function calcularPrecioWeb() {
      mostrarError("");
      const cliente = document.getElementById('clienteObra').value.trim();
      const mecanismo = document.getElementById('mecanismo').value;
      const ancho = document.getElementById('ancho').value;
      const alto = document.getElementById('alto').value;
      const doble = document.getElementById('dobleSistema').checked;

      if (!cliente) return mostrarError("Por favor ingresá el Cliente / Obra.");
      if (!ancho || !alto) return mostrarError("Ingresá el ancho y el alto.");

      document.getElementById('resultadoPrecio').innerText = "Calculando...";

      // Llamada simulada/vía Apps Script
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(precio) {
            ultimoPrecioCalculado = precio;
            document.getElementById('resultadoPrecio').innerText = "Precio: " + precio;
            document.getElementById('btnAgregar').style.display = 'block';
          })
          .withFailureHandler(function(err) {
            mostrarError("Error al calcular: " + err.message);
            document.getElementById('resultadoPrecio').innerText = "";
          })
          .calcularPrecio(mecanismo, ancho, alto, doble, cliente);
      } else {
        // Fallback en caso de fetch API externa
        const params = new URLSearchParams({
          action: 'calcularPrecio',
          data: JSON.stringify([mecanismo, ancho, alto, doble, cliente])
        });
        
        fetch(`${SCRIPT_URL}?${params.toString()}`)
          .then(res => res.json())
          .then(data => {
            if(data.ok) {
              ultimoPrecioCalculado = data.precio;
              document.getElementById('resultadoPrecio').innerText = "Precio: " + data.precio;
              document.getElementById('btnAgregar').style.display = 'block';
            } else {
              mostrarError(data.error || "Error al calcular precio.");
              document.getElementById('resultadoPrecio').innerText = "";
            }
          })
          .catch(err => {
            mostrarError("Error de conexión con la planilla.");
            document.getElementById('resultadoPrecio').innerText = "";
          });
      }
    }

    function agregarAlPedido() {
      mostrarError("");
      const cliente = document.getElementById('clienteObra').value.trim();
      const mecanismo = document.getElementById('mecanismo').value;
      const ancho = document.getElementById('ancho').value;
      const alto = document.getElementById('alto').value;
      const tela = document.getElementById('tipoTela').value;
      const color = document.getElementById('colorTela').value;
      const caida = document.getElementById('caida').value;
      const cadena = document.getElementById('cadena').value;
      const doble = document.getElementById('dobleSistema').checked ? "SI" : "NO";
      const obs = document.getElementById('observaciones').value;

      if (!ultimoPrecioCalculado) return mostrarError("Calculá el precio primero.");

      const detObs = `Caída: ${caida} | Cadena: ${cadena}` + (obs ? ` | Obs: ${obs}` : "");

      productosEnPedido.push({
        mecanismo: mecanismo,
        ancho: ancho,
        alto: alto,
        tela: tela,
        color: color,
        doble: doble,
        cantidad: 1,
        observaciones: detObs,
        precio: ultimoPrecioCalculado
      });

      renderizarPedido();
      
      // Limpiar campos de la cortina
      document.getElementById('ancho').value = "";
      document.getElementById('alto').value = "";
      document.getElementById('tipoTela').value = "";
      document.getElementById('colorTela').value = "";
      document.getElementById('observaciones').value = "";
      document.getElementById('dobleSistema').checked = false;
      document.getElementById('resultadoPrecio').innerText = "";
      document.getElementById('btnAgregar').style.display = 'none';
      ultimoPrecioCalculado = "";
    }

    function renderizarPedido() {
      const container = document.getElementById('listaPedidoItems');
      container.innerHTML = "";

      productosEnPedido.forEach((p, i) => {
        const item = document.createElement('div');
        item.className = 'pedido-item';
        item.innerHTML = `
          <strong>Cortina #${i+1}: ${p.mecanismo} (${p.ancho}m × ${p.alto}m)</strong><br>
          Tela: ${p.tela || '-'} (${p.color || '-'}) | Doble: ${p.doble}<br>
          ${p.observaciones}<br>
          <strong style="color:#1b5e20;">Precio: ${p.precio}</strong>
        `;
        container.appendChild(item);
      });

      document.getElementById('listaPedidoContainer').style.display = productosEnPedido.length > 0 ? 'block' : 'none';
    }

    function enviarPedidoWeb() {
      mostrarError("");
      const cliente = document.getElementById('clienteObra').value.trim();
      const email = document.getElementById('emailVendedor').value.trim();

      if (!cliente) return mostrarError("Falta el Cliente / Obra.");
      if (productosEnPedido.length === 0) return mostrarError("No hay productos agregados.");

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function() {
            document.getElementById('contenidoFormulario').style.display = 'none';
            document.getElementById('mensajeExito').style.display = 'block';
          })
          .withFailureHandler(function(err) {
            mostrarError("Error al guardar pedido: " + err.message);
          })
          .guardarPedido(cliente, productosEnPedido, email);
      } else {
        const payload = {
          vendedor: cliente,
          emailVendedor: email,
          productos: productosEnPedido
        };

        fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
          if (data.ok) {
            document.getElementById('contenidoFormulario').style.display = 'none';
            document.getElementById('mensajeExito').style.display = 'block';
          } else {
            mostrarError(data.error || "Error al guardar el pedido.");
          }
        })
        .catch(err => {
          mostrarError("Error al enviar el pedido.");
        });
      }
    }

    function nuevoPedido() {
      productosEnPedido = [];
      document.getElementById('listaPedidoItems').innerHTML = "";
      document.getElementById('listaPedidoContainer').style.display = 'none';
      document.getElementById('contenidoFormulario').style.display = 'block';
      document.getElementById('mensajeExito').style.display = 'none';
      document.getElementById('clienteObra').value = "";
    }
  </script>
</body>
</html>
